<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#f6f8fb;color:#222}
header{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;padding:0 32px}
.wrap{display:flex;height:calc(100vh - 72px)}
aside{width:300px;min-width:300px;background:#fff;border-right:1px solid #e5e7eb;padding:20px;overflow-y:auto}
.search{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:12px;font:inherit;margin-bottom:20px}
.search:focus{outline:none;border-color:#185ADB;box-shadow:0 0 0 3px rgba(24,90,219,.1)}
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;cursor:pointer;margin-bottom:8px}
.cat.active{background:#eaf2ff}
.cat-title{flex:1;min-width:0;font-weight:600;line-height:1.35}
.cat.active .cat-title{color:#185ADB}
.badge{padding:4px 10px;background:#eaf2ff;color:#185ADB;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0}
main{flex:1;overflow:auto;padding:32px}
.acc{background:#fff;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:14px;overflow:hidden}
.head{padding:18px 20px;display:flex;justify-content:space-between;gap:16px;cursor:pointer;font-weight:600}
.icon{font-size:22px;color:#185ADB;flex-shrink:0}
.body{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 20px;color:#555;line-height:1.7}
.acc.open .body{max-height:1000px;padding:0 20px 20px}
.body ul{margin:8px 0;padding-left:22px}
.body li{margin:4px 0}
a{color:#185ADB;text-decoration:none}
h2{margin-top:0}
</style>
</head>
<body>
<header><h1>Help Center</h1><div><strong>Total FAQs: 64</strong></div></header>
<div class="wrap">
<aside><input id="search" class="search" placeholder="Search FAQs"><div id="nav"></div></aside>
<main id="content"></main>
</div>
<script>
const DATA=[{"name": "Shipping & Delivery", "count": 11, "faqs": [{"q": "Where is my order?", "a": "The latest order status is available in the My Orders section.<br><br><ul><li>App: Tap Orders from the bottom menu.<\/li><li>Website: Go to Account &gt; My Orders.<\/li><\/ul><br>Select the relevant order to view real-time updates. Once the order is packed and handed over to the courier, tracking becomes available and the tracking link is shared via SMS and email.<br><br>The shipment timeline and tracking link are also available in My Orders section."}, {"q": "Why is my order delayed or taking longer than expected?", "a": "The latest order status and expected delivery date are available in the My Orders section through the shipment timeline.<br><br>If the order is “In Transit”: The shipment is moving between courier hubs. If there is no tracking update for 3 business days, please contact support for further assistance.<br><br>If the order is “Out for Delivery”: The package is with the delivery agent and is expected to be delivered today. Delivery may take place later in the day depending on the agent’s route and number of deliveries. If delivery is not completed, it is usually rescheduled for the next business day.<br><br>If the order was expected today but was not delivered: The courier may reschedule the delivery to the next business day if all deliveries in the area could not be completed. The updated expected delivery date will be shown on the tracking page. No action is required.<br><br>Delivery timelines may vary due to high delivery volumes, weather conditions, address issues, courier routing constraints, local disruptions, or hub processing delays."}, {"q": "My order was marked as delivered, but I didn't receive it, or the delivery agent didn't attempt delivery. What should I do?", "a": "If an order is marked as Delivered but has not been received, please contact support with the Order ID within 3 days of the delivery date. The delivery will be verified with the courier partner, and the issue will be investigated.<br><br>If the delivery agent did not attempt delivery or a delivery attempt was incorrectly marked, another attempt is usually scheduled automatically. The latest status is available in the My Orders section. If there is no update or delivery attempt within 1 business day, please contact support for further assistance with the courier partne"}, {"q": "What should I do if my package is damaged, opened, tampered with, or has missing items?", "a": "If the package appears damaged or opened at the time of delivery, please refuse the delivery. The package will be returned automatically.<br><br>If the package has already been accepted and the product is found to be damaged, tampered with, or missing items, please contact support within 3 days of delivery to raise a return request.<br><br>Upload clear images showing:<br><ul><li>Product and outer packaging<\/li><li>Damage or tampering, if applicable<\/li><\/ul><br>An unboxing video can also be uploaded to help with verification.<br><br>Please ensure the images and video are well-lit, in focus, and clearly show the issue.<br><br>The return request will be reviewed, and an update will be provided within 2 business days."}, {"q": "Can I change my delivery address or phone number after my order has been shipped?", "a": "Once an order has been dispatched, changes to the delivery address or phone number may not be possible, as the shipment may already be assigned to a courier route.<br><br>For incorrect details, please contact support with the updated information. The support team will check whether the details can be updated and assist with the next steps. Incorrect information may result in delivery delays or failed delivery attempts."}, {"q": "How long does it take for an order to be delivered?", "a": "Delivery timelines may vary depending on your location and courier availability. Most orders are delivered within 2–5 business days after dispatch."}, {"q": "I missed my delivery. Can I request delivery on another day or at a specific time?", "a": "Yes. Courier partners generally attempt delivery up to 3 times. If a delivery is missed, another attempt is usually scheduled automatically. Delivery attempts and shipment updates are available in the My Orders section.<br><br>If the delivery agents contacts you, delivery can be requested for another day or a convenient time, subject to availability. Specific delivery time slots and pre-delivery calls cannot be guaranteed, as they depend on the courier partner’s route, policies, and working hours."}, {"q": "Does Nutrabay deliver to all pincodes in India?", "a": "Delivery is available across most serviceable pincodes in India through courier partners. Availability depends on courier coverage for the specific pincode.<br><br>If a pincode is not serviceable, the information will be displayed during checkout after entering the delivery pincode, before placing the order."}, {"q": "Will my order be delivered in multiple shipments?", "a": "If the order contains multiple items, they may be shipped separately depending on product availability or warehouse location. Each shipment will have its own tracking link, which will be shared via email and will also be available in My Orders section."}, {"q": "Why has my order been returned?", "a": "Orders may be returned due to unreachable addresses, multiple failed delivery attempts, refusal at delivery, or Pay on Delivery (POD) payment issues. Once the order is marked as returned, the refund will be processed as per the refund policy."}, {"q": "Why is my delivery being rescheduled repeatedly?", "a": "Rescheduling may happen due to restricted access, high delivery volume, weather conditions, local disturbances, or hub delays. The next delivery date is updated automatically.<br><br>If the order has been rescheduled more than twice, please contact our support team. After three failed delivery attempts, the order will be returned and refunded."}]}, {"name": "Returns, Refunds & Cancellation", "count": 12, "faqs": [{"q": "Can I cancel my order?", "a": "An order can be cancelled until it reaches Awaiting Packaging status. Go to My Orders, select the order, and tap Cancel. Cancellation applies to the entire shipment and is not available once packing has started.<br><br>Once the order has been shipped, cancellation is no longer possible as the shipment is with the courier. The delivery can be refused at the doorstep. Depending on the courier partner, an OTP may be required to confirm the cancellation.<br><br>If the order has already been delivered, an eligible return request can be raised within 14 days of delivery."}, {"q": "I received a damaged item, wrong product or missing unit. What should I do?", "a": "For damaged items, wrong products, or missing units, the issue must be reported within 3 days of delivery. Clear photos and a description of the issue are required for verification. An unboxing video is also recommended, as it helps with the investigation.<br><br>Upload clear images showing:<br><ul><li>Product and outer packaging<\/li><li>Damage or tampering, if applicable<\/li><\/ul><br>Please ensure the images and video are well-lit, in focus, and clearly show the issue.<br><br>Once the return request is approved, a courier pickup is arranged from the address selected during the return request. After the item reaches the warehouse, it undergoes a quality check to verify the reported issue. Once the check is completed, the refund is initiated according to the payment method."}, {"q": "Which products or cases are eligible for return?", "a": "Eligible returns:<br>The product must be unopened, unused, and returned in its original packaging with all labels, seals, authenticity stickers, and scratch codes intact (where applicable).<br><br>For merchandise items, the product must be unused, unwashed, have all original tags attached, and be returned in its original packaging.<br><br>Returns are not accepted for:<br><ul><li>Workout equipment and accessories (unless there is a manufacturing defect)<\/li><li>Opened or used products<\/li><li>Complaints related to taste or personal health concerns<\/li><li>Products with tampered scratch codes, authenticity stickers, or serial numbers<\/li><li>Freebie items returned without the main purchased product<\/li><li>Individual items from combo packs<\/li><\/ul><br>Returns may be declined if the product shows signs of use, damage, missing labels or tags, opened seals, expired items, or does not match the reported issue."}, {"q": "When will I receive my refund?", "a": "Refund timelines depend on the type of refund.<br><br>For order cancellations:<br>If an order is cancelled before Packed status or refused at the time of delivery, the refund is initiated once the cancellation is confirmed. The refund is initiated within 1–2 business days after confirmation.<br><br>For refunds without a return:<br>The refund is initiated after the refund request details are verified and approved. The refund is initiated within 1–2 business days after approval.<br><br>For returned orders:<br>The refund is initiated after the returned item reaches the warehouse and completes the quality check. Once approved, the refund is initiated within 1–2 business days.<br><br>Refund method:<br>For prepaid orders, the refund is credited to the original payment method. For Pay on Delivery (POD) orders, the refund is processed to the bank account details provided during the return process.<br><br>After the refund is initiated, the bank or payment provider may take up to 7 business days to credit the amount. A notification is sent once the refund has been initiated."}, {"q": "How do I return an item, and what images should I upload?", "a": "To return an item, go to the My Orders section and select the item to be returned.<br><br>Select the quantity to be returned and choose the return reason that best matches the issue.<br><br>Upload clear images showing:<br><br><ul><li>Top, bottom, front and back of the product<\/li><li>Outer seal: Protective seal on the outside of the product<\/li><li>Inner seal, if there is no outer seal: Protective seal under the cap/lid, covering the product opening.<\/li><li>Scratch code, if available: Found under the scratch-off panel on the packaging.<\/li><li>Batch number &amp; expiry date: Printed on the product/packaging.<\/li><\/ul><br>A video can also be uploaded using “Upload Video.”<br><br>Please ensure the images are well-lit, in focus, taken from a close distance, and clearly show all required areas. Return requests may be declined if the images are unclear or incomplete.<br><br>Continue to select the pickup address and submit the request. The request will be reviewed, and a courier pickup will be arranged after approval. A notification will be sent once the pickup is completed."}, {"q": "How long do I have to request a return?", "a": "Within 3 days of delivery: Damaged items, wrong products, missing units, or orders marked delivered but not received.<br><br>Within 14 days of delivery: All other eligible return requests. Requests made after the applicable window cannot be processed."}, {"q": "How can I check my return or refund status?", "a": "The return or refund status can be conveniently tracked from the My Orders section.<br><br><ul><li>On the app: Tap Orders from the bottom menu.<\/li><li>On the website: Go to Account &gt; My Orders<\/li><\/ul><br>Locate the item for which the return was raised. The current status is displayed on the order card.<br><br>For additional details, select the item to view the complete status, including return request pending, pickup completed, or refund initiated.<br><br>The status is updated automatically as each step is completed."}, {"q": "What happens after I submit a return request?", "a": "Once approved, pickup is usually attempted within 1–2 business days, depending on courier availability.<br><br>After pickup, the product reaches our warehouse, where it undergoes a quality check (QC) verifying product condition, reported issue, packaging, seals, scratch code/authenticity sticker, batch, expiry, and completeness. Once approved, the refund is processed and you&#x27;ll receive updates via email and SMS."}, {"q": "How should I pack the item for return pickup?", "a": "Place the product back in its original packaging. The product must be unopened, unused, with all seals intact, and in the same condition as delivered. The authenticity sticker or scratch code must be intact and not tampered with.<br><br>The courier partner will collect the item and carry it back securely."}, {"q": "Can I replace/exchange my product instead of returning it?", "a": "Replacements and exchanges are currently not available. Eligible items can be returned and a new order can be placed for the required product.<br><br>For orders containing multiple items, only the affected item can be returned within the applicable return window."}, {"q": "Can I change my pickup address after raising a return request?", "a": "Pickup address changes may not always be possible once a courier has been assigned to the original address. A change can be requested by contacting support, subject to courier availability and serviceability of the new address."}, {"q": "Why did my pickup fail or get delayed?", "a": "Pickup can fail if the courier is unable to complete the pickup at the provided location. Common reasons include:<br><br><ul><li>Customer not available at the pickup address<\/li><li>Phone number not reachable when the courier tried to contact you<\/li><li>Incorrect or incomplete pickup address<\/li><li>Pickup address outside the courier’s serviceable area<\/li><li>Entry restrictions at the pickup location<\/li><li>Local issues such as weather, strikes, or route disruptions<\/li><\/ul><br>In such cases, the courier usually attempts the pickup again.<br><br>If the courier does not attempt pickup within 3 business days, or if there are 3 failed pickup attempts, please contact our support team for assistance."}]}, {"name": "Ordering Related", "count": 7, "faqs": [{"q": "Where can I find my order details and track its status?", "a": "All order details are available in the My Orders section.<br><br><ul><li>App: Tap Orders from the bottom menu.<\/li><li>Website: Go to Account &gt; My Orders.<\/li><\/ul><br>Each ordered item is listed separately. Select an item to view product details, delivery address, payment method, invoice, and current status. Order information is updated automatically as the order progresses.<br><br>If the order status shows Processing: The order is awaiting confirmation. Orders are typically confirmed within a few hours, with updates shared via SMS and email.<br><br>Once the order is confirmed, it is usually dispatched within 1 business day. The order status can be tracked in the My Orders section as it moves from Processing to Dispatched.<br><br>Once the order is shipped, the tracking link will be available in Order Details and will also be shared via SMS and email. The shipment can also be tracked from My Orders by selecting the order and viewing the shipment timeline."}, {"q": "How can I modify my order (phone number/address/product)?", "a": "Order details cannot be edited directly after placing an order. If you need to make a change, contact our support team as soon as possible. We will check if the request can be accommodated and, where applicable, raise it with the courier partner.<br><br>1. Changes to ordered items<br>Changes to products in an order are limited. Items can only be cancelled or removed, and this is possible until the order status is Awaiting Packing. Once the order moves beyond this stage, product changes would not be possible.<br><br>2. Contact number change<br>A contact number change can be requested at any stage, except when the order is Out for Delivery (OFD). Updates usually take 24–48 hours to process.<br><br>3. Delivery address change<br>An address change can be requested through contacting the support team. If feasible, the updated address is processed within 24–48 hours. The address change is subject to courier serviceability and order status.<br><br>Important: Updating the contact number or address in My Profile section does not update an already placed order.<br><br>All modification requests are subject to operational feasibility, courier serviceability and order status."}, {"q": "How do I know my order has been confirmed?", "a": "An order is confirmed once an order confirmation is received via email and SMS. The confirmation can also be checked in the My Orders section:<br><br><ul><li>App: Tap Orders from the bottom menu.<\/li><li>Website: Go to Account &gt; My Orders.<\/li><\/ul><br>If the status shows “Order Placed”, the order has been successfully confirmed.<br><br><ul><li>For prepaid orders, the order appears after successful payment.<\/li><li>For Pay on Delivery (POD) orders, it appears immediately after placing the order.<\/li><\/ul><br>If the order is not visible in My Orders, please contact support for assistance."}, {"q": "What should I do if my payment fails or my order is not visible after payment?", "a": "If there is an issue with payment, please check the My Orders section.<br><br><ul><li>App: Tap Orders from the bottom menu.<\/li><li>Website: Go to Account &gt; My Orders.<\/li><\/ul><br>Payment failed: The order is created with Payment Pending status. Select Retry Payment on the order card to complete the purchase. Retry Payment is available for up to 4 hours from order creation.<br><br>Payment succeeded, but the order is not visible: Refresh the page and check again. It may take a few minutes for the order to appear. If the amount was deducted but the order was not placed, the amount is usually reversed automatically by the bank or payment provider.<br><br>If the issue persists, please contact support with the payment reference ID for assistance."}, {"q": "I placed the same order twice by mistake. What should I do?", "a": "If a duplicate order has been placed, open the order from the My Orders section.<br><br><ul><li>App: Tap Orders from the bottom menu.<\/li><li>Website: Go to Account &gt; My Orders.<\/li><\/ul><br>To cancel the duplicate order, select any item and tap Cancel. Cancelling one item automatically cancels the entire shipment. Cancellation is available while the order is in Awaiting Packing status.<br><br>If the order has already been packed, cancellation can be requested by refusing the delivery at the doorstep.<br><br>The refund is usually processed within 1–2 business days after cancellation."}, {"q": "Why can't I place a Pay on Delivery (POD) order?", "a": "Pay on Delivery (POD) availability depends on factors such as:<br><ul><li>Delivery pincode serviceability<\/li><li>Order value or product eligibility<\/li><li>Past delivery or order history: Previous order outcomes, such as repeated cancellations, refused deliveries, or unsuccessful deliveries may affect POD availability.<\/li><\/ul><br>If POD is unavailable, please choose a prepaid payment option at checkout."}, {"q": "Does Nutrabay ship internationally?", "a": "We currently offer shipping services exclusively within India. We are working towards expanding our reach to international locations in the future."}]}, {"name": "Product Authenticity", "count": 6, "faqs": [{"q": "How does Nutrabay ensure product authenticity, and how can I verify my product?", "a": "Nutrabay products are 100% genuine and sourced directly from verified supply partners, including brands and authorised importers. Products are delivered in their original, sealed packaging.<br><br>Product authenticity can be verified by checking the manufacturing details, importer information, tax invoice, and sealed packaging. Many brands also provide batch numbers, QR codes, or scratch codes that can be verified through their official websites or apps.<br><br>For Nutrabay products, authenticity can also be verified using the unique scratch code sticker through https://nutrabay.com/authenticate.<br><br>For assistance with verifying a third-party brand product, please contact support."}, {"q": "I'm concerned about the authenticity of a non-Nutrabay product, or its packaging looks different from what I saw online. What should I do?", "a": "Packaging may vary as brands regularly update their labels, designs, and security features. Different packaging does not necessarily indicate that a product is inauthentic.<br><br>For third-party brands, the brand or importer details are printed on the product packaging and can be used to verify authenticity directly with the brand or importer.<br><br>Products with valid manufacturing or importer details and an intact seal are generally considered authentic. For any concerns or further assistance, please contact support."}, {"q": "Does Nutrabay source products directly from brands or authorized importers?", "a": "Yes. Our supply chain is strictly controlled.<br><br>We procure products directly from brands or their authorized importers and distributors in India.<br><br>We do not source from unverified wholesalers or open-market suppliers, ensuring all products are genuine and compliant."}, {"q": "What packaging or label details should I check when the order arrives?", "a": "Please check that the outer seal is intact and not tampered with.<br><br>Review the label for:<br><ul><li>Brand name<\/li><li>Importer name<\/li><li>MRP<\/li><li>Batch number<\/li><li>Manufacturing and expiry dates<\/li><li>FSSAI details<\/li><\/ul><br>If available, verify the scratch code, QR code, or hologram using the brand’s official method."}, {"q": "Are product packaging changes common due to brand updates?", "a": "Yes, brands regularly update their packaging design, security features, fonts and colors. These changes do not affect product authenticity. As long as the product has proper manufacturer or importer details, sealed packaging and correct labels, it is considered genuine."}, {"q": "How do I verify the batch number and expiry information?", "a": "Batch number, manufacturing date, and expiry date are printed on the label or container.<br><br>The details can be cross-checked on the brand’s official website or with their customer support for additional confirmation.<br><br>Authentic products always have clear and readable codes and dates."}]}, {"name": "Payments & Coupons", "count": 7, "faqs": [{"q": "What payment methods does Nutrabay accept?", "a": "At checkout, multiple secure payment options are available, depending on availability:<br><br><ul><li>UPI<\/li><li>Debit and Credit Cards (Visa, Mastercard, RuPay, Amex, Diners, corporate, prepaid, retail, and international cards)<\/li><li>Net Banking<\/li><li>Mobile Wallets<\/li><li>Pay on Delivery (POD), where available<\/li><\/ul"}, {"q": "What is Pay on Delivery (POD) and how does it work?", "a": "Pay on Delivery (POD) allows payment to be made at the time of delivery. If POD is available for the delivery pincode and the items in the cart are eligible, the option will be displayed at checkout.<br><br>Select Pay on Delivery (POD) during checkout, confirm the delivery details, and place the order. At the time of delivery, payment can be made by cash or through the payment methods offered by the delivery partner. If exact cash is not available, online payment may also be completed using the available options.<br><br>If POD is not displayed at checkout, the delivery pincode or items in the cart may not be eligible for Pay on Delivery."}, {"q": "What should I do if my payment failed, money was deducted or I was charged twice?", "a": "If a payment fails, the order may be created with Payment Pending status. Go to My Orders, select the order, and choose Retry Payment. The payment can be retried using the same or another available payment method.<br><br>If the amount was deducted but no order was placed, or the same order was charged twice, the additional amount is usually reversed automatically by the bank or payment provider. The payment status can be checked through the bank account or UPI app.<br><br>If the reversal is delayed or not received, please contact the bank or payment provider for the applicable refund timeline, as failed and duplicate payment reversals are processed by them."}, {"q": "How do I apply a coupon? Can I use more than one coupon?", "a": "A coupon code can be applied on the checkout page before completing payment.<br><br>Only one coupon can be used per order. If multiple offers are available, the offer providing the best value can be selected. Some coupons may require a minimum order value or apply only to selected brands or product categories.<br><br>The applicable terms and conditions are displayed on the checkout page when the coupon is applied."}, {"q": "Does Nutrabay offer EMI or Buy Now Pay Later (BNPL)?", "a": "EMI and Buy Now Pay Later (BNPL) options are not available at the moment. The payment can be completed using UPI, Credit Cards, Debit Cards, Wallets, Net Banking, or Pay on Delivery (POD), wherever applicable."}, {"q": "Are the prices inclusive of taxes and are there any additional or shipping charges?", "a": "Yes. All prices shown on Nutrabay are inclusive of applicable taxes, and there are no hidden charges. The product price displayed is the final price before shipping.<br><br>Shipping is free on orders above ₹350. For orders below ₹350, a delivery charge may apply. Any applicable shipping charges, discounts, and the final payable amount are clearly displayed in the cart and during checkout."}, {"q": "Does Nutrabay store my card details? Are card payments secure?", "a": "No. Nutrabay does not store any card details. All card payments are processed through RBI-compliant, secure payment gateways with encryption and fraud-monitoring systems. Card numbers and CVV information are never stored, and transactions are authorized only after verification by the bank or card provider."}]}, {"name": "Account & Profile", "count": 5, "faqs": [{"q": "How can I create a Nutrabay account?", "a": "An account on Nutrabay can be created using a mobile number or email address.<br><br>Enter the mobile number on the Sign Up screen and follow the instructions.<br><br><ul><li>If the mobile number is not registered, an email address will be requested.<\/li><li>If the mobile number is already registered, the login screen will open.<\/li><li>If the email address is already associated with an account, a different email address will be required.<\/li><\/ul><br>An OTP will be sent to the mobile number for verification. Once the OTP is successfully verified, the account will be created.<br><br>A confirmation will be shared via SMS and email once registration is complete. The account will then be ready for use, including placing orders."}, {"q": "How can I update my account details?", "a": "Account details can be managed from the My Account section.<br><br><ul><li>Personal details: Go to My Profile to update the name, date of birth, phone number, or email address. An OTP may be required to verify an updated phone number or email. Once verified, the changes are saved automatically.<\/li><li>Addresses: Go to My Addresses and select Add New Address. Enter the name, phone number, complete address, and pincode, then save the address. Multiple addresses can be saved and selected during checkout.<\/li><\/ul"}, {"q": "What if I forget my account password?", "a": "To reset the password, select **Forgot Password** on the login page.<br><br>Enter the registered email address or mobile number and complete OTP verification.<br><br>Once verified, a new password can be set to access the account again."}, {"q": "Are my personal details safe when I create an account?", "a": "Yes. Personal information is protected using secure systems and encrypted connections.<br><br>Sensitive payment details are not stored, and personal information is not shared with unauthorised third parties.<br><br>Information is used to manage orders and provide a better customer experience."}, {"q": "How can I permanently delete my Nutrabay account?", "a": "An account deletion request can be submitted from the My Profile page. If there are any active orders, account deletion will only be available once the orders are completed.<br><br>Once confirmed, the account, saved addresses, and order history will be permanently deleted.<br><br>Please note that account deletion is permanent and cannot be reversed."}]}, {"name": "FitClub (Loyalty Program)", "count": 9, "faqs": [{"q": "What is FitClub? Do I need to pay to join?", "a": "FitClub is Nutrabay&#x27;s loyalty membership program. Every user who registers on the Nutrabay website or app automatically becomes a FitClub member. Membership is completely free. Members receive rewards, discounts, and benefits based on their FitClub membership level."}, {"q": "What are the FitClub membership levels, benefits, and how do I upgrade?", "a": "The FitClub level determines the rewards and benefits available.<br><br>Membership levels are based on total spend over the last 365 days:<br><br><ul><li>Explorer: Less than ₹7,500<\/li><li>Achiever: ₹7,500 to less than ₹20,000<\/li><li>Legend: ₹20,000 or more<\/li><\/ul><br>The level can be upgraded by increasing total spend through eligible purchases. Spend is updated 14 days after successful delivery, rather than immediately after purchase.<br><br>Once a spending threshold is reached, the level is upgraded immediately and a new 365-day membership cycle begins.<br><br>For more details about FitClub benefits, please refer to the membership benefits section."}, {"q": "How long is my FitClub membership valid?", "a": "FitClub membership is valid for a lifetime, while the membership level is reviewed based on purchase activity.<br><br>Once a new level is reached, its benefits remain active for 365 days. If a higher level is reached during this period, the membership level is upgraded immediately.<br><br>At the end of the 365-day period, purchases made during that period are reviewed and the membership level is reassessed based on total spend."}, {"q": "What are NB Coins and how do I earn them?", "a": "NB Coins are Nutrabay’s reward currency. 1 NB Coin = ₹1 discount on eligible Nutrabay brand products.<br><br>FitClub members earn NB Coins on every eligible purchase:<br><ul><li>Explorer: 1 NB Coin for every ₹100 spent on each item<\/li><li>Achiever: 2 NB Coins for every ₹100 spent on each item<\/li><li>Legend: 3 NB Coins for every ₹100 spent on each item<\/li><\/ul><br>NB Coins are credited after the order is delivered. They are not earned for cancelled items, and coins earned for returned items are deducted from the balance. Loyalty benefits currently apply only to orders placed through the Nutrabay website or app."}, {"q": "How can I use NB Coins? How much discount can I get?", "a": "NB Coins can be redeemed only on Nutrabay brand products. They can also be combined with other offers and discounts.<br><br>Redemption limits depend on the FitClub level:<br><ul><li>Explorer: Up to 5% of total item value (excluding other discounts)<\/li><li>Achiever: Up to 10%<\/li><li>Legend: Up to 15%<\/li><\/ul"}, {"q": "When do NB Coins expire and how can I check my balance?", "a": "NB Coins earned through FitClub are valid for 6 months from the date they are credited. Every time a new eligible order is delivered, the expiry of all existing NB Coins is extended by another 6 months.<br><br>The NB Coin balance can be checked under Profile → My Account → Wallet or by clicking here."}, {"q": "What happens to my NB Coins if I cancel or return an order?", "a": "Cancelled items: NB Coins are not earned on cancelled items, and only successfully completed purchases are included in total spend.<br><br>If NB Coins were redeemed as a discount on a cancelled item, the redeemed coins are refunded to the NB Coin balance.<br><br>Returned items: NB Coins are credited after delivery. If an item is later returned, the NB Coins earned on that item are deducted from the balance. Any NB Coins redeemed as a discount on the returned item are refunded.<br><br>For partial returns, only successfully delivered items are included in total spend."}, {"q": "Why isn't my FitClub level upgrading or my NB Coin balance updating?", "a": "FitClub Level: Total spend is updated 14 days after an order is delivered. Once the required spending threshold is reached, the FitClub level is upgraded immediately.<br><br>NB Coins: NB Coins are credited after successful delivery. Cancelled items do not earn NB Coins. If fewer items are delivered than ordered, NB Coins are credited only for the successfully delivered items."}, {"q": "Will I earn NB Coins on offline store purchases?", "a": "Currently, FitClub rewards and NB Coins are available only for purchases made through the Nutrabay website or app. Loyalty benefits for offline store purchases may be introduced in the future."}]}, {"name": "Product Reviews", "count": 7, "faqs": [{"q": "How can I submit a product review, and who can write one?", "a": "Any logged-in Nutrabay user can submit a review from the product page. Scroll to the Reviews section, select a star rating, write the feedback, and submit it.<br><br>Reviews may be written by any registered user. Customers who have purchased the product on Nutrabay will have a Verified Buyer badge displayed with their review, helping other customers identify purchase-based feedback."}, {"q": "Can I edit, delete, or add photos to my review?", "a": "Once a review has been submitted, it cannot be edited or deleted. This helps maintain transparency and reliability for all customers.<br><br>A maximum of 5 photos can be added to a review to support the feedback. Video uploads are currently not supported."}, {"q": "Why is my review not visible yet?", "a": "After submission, reviews go through a standard moderation check before being published. This helps ensure reviews are genuine, relevant, and follow platform guidelines. Once approved, the review becomes visible on the product page."}, {"q": "Can I upload photos or videos with my review?", "a": "A maximum of 5 photos can be added to a review. Video uploads are currently not supported."}, {"q": "Does Nutrabay moderate or filter reviews?", "a": "Yes. Reviews are moderated to keep them relevant, genuine, and helpful. A review may be removed if it contains:<br><br><ul><li>Promotional content, influencer content or self-promotion<\/li><li>Social media handles or external links<\/li><li>Abusive, rude, or offensive language<\/li><li>Sexual or obscene text or imagery<\/li><li>Irrelevant or spam content<\/li><li>Content focused only on delivery or customer service instead of the product<\/li><\/ul><br>Image moderation: Images containing nudity or sexual content are not allowed.<br><br>Moderation is not based on whether a review is positive or negative. Genuine product feedback is not changed or altered."}, {"q": "Will writing a negative review affect my order or refund?", "a": "No. Reviews do not affect order status, return eligibility, or refund processing. Honest feedback can be shared without affecting any service-related outcomes."}, {"q": "Is my identity visible to brands when I post a review?", "a": "Only the username is displayed with a review. Personal details such as email address, phone number, and order information are not visible to brands."}]}];
let active=0;
const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search');

function drawNav(){
  nav.innerHTML='';
  DATA.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='cat'+(i===active?' active':'');
    d.innerHTML=`<span class="cat-title">${c.name}</span><span class="badge">${c.count}</span>`;
    d.onclick=()=>{active=i;drawNav();drawContent();};
    nav.appendChild(d);
  });
}

function drawContent(){
  const t=search.value.toLowerCase();
  const c=DATA[active];
  let h=`<h2>${c.name}</h2>`;
  c.faqs.filter(f=>!t||f.q.toLowerCase().includes(t)||f.a.toLowerCase().includes(t)).forEach(f=>{
    h+=`<div class="acc"><div class="head"><span>${f.q}</span><span class="icon">+</span></div><div class="body">${f.a}</div></div>`;
  });
  content.innerHTML=h;
  document.querySelectorAll('.head').forEach(head=>head.onclick=()=>{
    const p=head.parentElement;
    document.querySelectorAll('.acc.open').forEach(x=>{if(x!==p){x.classList.remove('open');x.querySelector('.icon').textContent='+';}});
    p.classList.toggle('open');
    head.querySelector('.icon').textContent=p.classList.contains('open')?'−':'+';
  });
}
search.oninput=drawContent;
drawNav();
drawContent();
</script>

</html>
