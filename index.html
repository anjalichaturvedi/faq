<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f6f8fb;color:#222}

<header><h1>Help Center</h1><div><strong>Total FAQs: 64</strong></div></header>
<div class='wrap'><aside><input id='search' class='search' placeholder='Search FAQs'><div id='nav'></div></aside><main id='content'></main></div>
<script>
const DATA=[{"name": "Shipping & Delivery", "count": 11, "faqs": [{"q": "Where is my order?", "a": "You can view the latest status of your order in the <a href=\"#\">My Orders</a> section.<br><br>\u2022 App: Tap Orders from the bottom menu.<br>\u2022 Website: Go to Account &gt; <a href=\"#\">My Orders</a>.<br><br>Select the order you want to track to see real-time updates. Once your order is packed and handed over to the courier, tracking begins and a tracking link is shared via SMS and email. You can also view the shipment timeline and tracking link in <a href=\"#\">My Orders</a>."}, {"q": "Why is my order delayed or taking longer than expected?", "a": "Delivery delays may occur due to high delivery volumes, weather conditions, address issues, courier routing constraints, local disturbances, or hub processing delays.<br><br>If your order is &quot;In Transit&quot;: It means your shipment is moving between courier hubs. If there is no tracking update for 3 business days, please contact our support team for escalation.<br><br>If your order is &quot;Out for Delivery&quot;: It means your package is with the delivery agent and is expected to be delivered today. Delivery may happen later in the day if the agent has multiple stops. If delivery is not completed, it is usually rescheduled for the next business day.<br><br>If your order was expected today but wasn&#x27;t delivered: The courier may move your delivery to the next business day if they couldn&#x27;t complete all deliveries in your area. The updated expected delivery date will appear on the tracking page. No action is needed from your side.<br><br>You can check the latest status anytime in <a href=\"#\">My Orders</a> section by viewing the shipment timeline."}, {"q": "My order was marked as delivered, but I didn&#x27;t receive it, or the delivery agent didn&#x27;t attempt delivery. What should I do?", "a": "If your order is marked as Delivered but you haven&#x27;t received it: Please contact our support team with your Order ID within 3 days of the order being marked as Delivered. We will verify the delivery with the courier partner and help resolve the issue as quickly as possible.<br><br>If the delivery agent didn&#x27;t attempt delivery or marked a fake delivery attempt: Another delivery attempt is usually scheduled automatically by the courier. You can check the latest status in the <a href=\"#\">My Orders</a> section. If there is no update or no delivery attempt is made within 1 business day, please contact our support team and we will follow up with the courier partner on your behalf."}, {"q": "What should I do if my package is damaged, opened, tampered with, or has missing items?", "a": "If the package appears damaged or opened at the time of delivery, please refuse the delivery. It will be returned automatically.<br><br>If you have already accepted the package and later find the product damaged, tampered with, or items missing, please contact our support team within 3 days of delivery to raise a return request. Please share clear photos showing the issue. We also urge you to create an unboxing video, as it helps us with the investigation. Your return request will be reviewed and updated within 2 business days."}, {"q": "Can I change my delivery address or phone number after my order has been shipped?", "a": "Once your order has been dispatched, address or phone number changes are usually not guaranteed because courier routes are fixed.<br><br>If your delivery address or phone number is incorrect, please contact our support team with the correct details. We&#x27;ll check if the information can be updated and guide you on the next steps. Incorrect details may cause delivery delays or failed delivery attempts."}, {"q": "How long does it take for an order to be delivered?", "a": "Delivery timelines depend on your location and courier availability. Most orders are delivered within 2 to 5 business days after dispatch.<br><br>For eligible pincodes, Same-Day Delivery (SDD), Next-Day Delivery (NDD), or 2-hour delivery may be available. If applicable, the delivery timeline is shown automatically on the product page or during checkout."}, {"q": "I missed my delivery. Can I request delivery on another day or at a specific time?", "a": "Yes. Courier partners usually attempt delivery up to 3 times, so if you miss a delivery, another attempt is generally scheduled automatically. You can track all delivery attempts and shipment updates in the <a href=\"#\">My Orders</a> section.<br><br>If the delivery agent contacts you, you may request delivery on a different day or coordinate a convenient delivery time, subject to their availability. Please note that specific delivery time slots and pre-delivery calls cannot be guaranteed, as they depend on the courier partner&#x27;s policies, route, and working hours."}, {"q": "Do you deliver to all pincodes in India?", "a": "We deliver to most serviceable pincodes across India through our courier partners. Delivery availability depends on courier coverage for your specific pincode. If a pincode is not serviceable, this will be shown during checkout after you enter your delivery pincode, before placing the order."}, {"q": "Will my order be delivered in multiple shipments?", "a": "If your order contains multiple items, they may be shipped separately depending on product availability or warehouse location. Each shipment will have its own tracking link, which will be shared via email and will also be available in <a href=\"#\">My Orders</a> section."}, {"q": "Why has my order been returned?", "a": "Orders may be returned due to unreachable addresses, multiple failed delivery attempts, refusal at delivery, or Pay on Delivery (POD) payment issues. Once the order is marked as returned, the refund will be processed as per the refund policy."}, {"q": "Why is my delivery being rescheduled repeatedly?", "a": "Rescheduling may happen due to restricted access, high delivery volume, weather conditions, local disturbances, or hub delays. The next delivery date is updated automatically.<br><br>If your order has been rescheduled more than twice, please contact our support team. After three failed delivery attempts, the order will be returned and refunded."}]}, {"name": "Returns, Refunds & Cancellation", "count": 12, "faqs": [{"q": "Can I cancel my order?", "a": "You can cancel your order until it is Awaiting Packaging. Go to <a href=\"#\">My Orders</a> section, select the order, and tap Cancel. Cancellation applies to the entire shipment and is not available once packing starts.<br><br>Once an order has been shipped, it cannot be cancelled because it is already with the courier. You may refuse delivery at the doorstep. Depending on the courier, you may be asked to share an OTP to confirm cancellation. If the order is delivered, you can raise a return request within 14 days of delivery."}, {"q": "I received a damaged item, wrong product or missing unit. What should I do?", "a": "If you receive a damaged item, wrong product, missing units, the issue must be raised within 3 days of delivery. During the request, you will be asked to upload clear photos and explain the issue so it can be verified. We also recommend recording an unboxing video as it help with the investigation.<br><br>Once approved, a courier pickup is arranged at the address selected while placing the return request. When the item reaches our warehouse, it goes through a quality check to confirm the issue. After the check is completed, the refund is released according to your payment method."}, {"q": "Which products or cases are eligible for return?", "a": "Eligible returns:<br>The product must be unopened, unused, and returned in its original packaging with all labels, seals, authenticity stickers, and scratch codes intact (where applicable).<br><br>For merchandise items, the product must be unused, unwashed, have all original tags attached, and be returned in its original packaging.<br><br>Returns are not accepted for:<br>\u2022 Workout equipment and accessories (unless there is a manufacturing defect)<br>\u2022 Opened or used products<br>\u2022 Complaints related to taste or personal health concerns<br>\u2022 Products with tampered scratch codes, authenticity stickers, or serial numbers<br>\u2022 Freebie items returned without the main purchased product<br>\u2022 Individual items from combo packs<br><br>Returns may be declined if the product shows signs of use, damage, missing labels or tags, opened seals, expired items, or does not match the reported issue."}, {"q": "When will I receive my refund?", "a": "Refund timelines depend on the type of refund.<br><br>For order cancellations:<br>If your order is cancelled before &quot;Packed&quot; status or refused at the time of delivery, the refund is initiated once the cancellation is confirmed in the system. After confirmation, we initiate the refund within 1\u20132 business days.<br><br>For refund without return orders:<br>Your refund is initiated after the verification of refund request details. Once the refund request is approved, we initiate the refund within 1\u20132 business days.<br><br>For returned orders:<br>Your refund is initiated after the returned item reaches our warehouse and completes the quality check. Once the quality check is approved, we initiate the refund within 1\u20132 business days.<br><br>Refund method:<br>For prepaid orders, the refund is sent back to the same payment method you used while placing the order. For Pay on Delivery (POD) orders, the refund is processed to the bank account details you provide during the return process.<br><br>After the refund is initiated from our side, your bank or payment provider may take up to 7 business days to credit the amount to your account. You\u2019ll receive a notification once the refund has been initiated."}, {"q": "How do I return an item, and what images should I upload?", "a": "To return an item, go to the <a href=\"#\">My Orders</a> section and select the item you want to return.<br><br>On the next screen, select the quantity you want to return and choose the return reason that best matches your issue.<br><br>Upload clear images of the product showing:<br>\u2022 Top, bottom, front, and back of the product<br>\u2022 Outer Seal<br>\u2022 Inner seal (If the product doesn&#x27;t have an outer seal)<br>\u2022  Scratch Code (If available)<br>\u2022 Batch number and expiry date printed on the product<br><br>You may also upload a video by selecting \u201cUpload Video\u201d.<br><br>Please ensure the images are well-lit, in focus, taken from close distance, and all required areas are clearly visible. Return requests may be rejected if the images are unclear, incomplete, or do not meet these requirements.<br><br>Continue to the next step and select the pickup address for the return. Once you submit the request, it is reviewed by our team. After approval, a courier pickup is arranged, and you&#x27;ll be notified once the pickup is completed."}, {"q": "How long do I have to request a return?", "a": "Within 3 days of delivery: Damaged items, wrong products, missing units, or orders marked delivered but not received.<br><br>Within 14 days of delivery: All other eligible return requests. Requests made after the applicable window cannot be processed."}, {"q": "How can I check my return or refund status?", "a": "You can track the status of your return or refund from <a href=\"#\">My Orders</a> section.<br><br>On the app: Tap Orders from the bottom menu.<br>On the website: Go to Account &gt; <a href=\"#\">My Orders</a><br><br>Look for the item you raised the return for. The current status is shown directly on the order card itself.<br><br>For more details, select the item to view the full status, such as return request pending, pickup completed, or refund initiated.<br><br>The status updates automatically as each step is completed."}, {"q": "What happens after I submit a return request?", "a": "Once approved, pickup is usually attempted within 1\u20132 business days, depending on courier availability. <br><br>After pickup, the product reaches our warehouse, where it undergoes a quality check (QC) verifying product condition, reported issue, packaging, seals, scratch code/authenticity sticker, batch, expiry, and completeness. Once approved, the refund is processed and you&#x27;ll receive updates via email and SMS."}, {"q": "How should I pack the item for return pickup?", "a": "Place the product back in its original packaging. The product must be unopened, unused, with all seals intact, and in the same condition as delivered. The authenticity sticker or scratch code must be intact and not tampered with.<br><br>The courier partner will collect the item and carry it back securely."}, {"q": "Can I replace/exchange my product instead of returning it?", "a": "Replacements and exchanges are not available. You may return the eligible item and place a new order. <br><br>If your order contains multiple items, you can return only the affected item within the applicable return window."}, {"q": "Can I change my pickup address after raising a return request?", "a": "Pickup address changes are not guaranteed because the courier is already assigned to the original address. You can request a change by contacting support, but approval depends on courier availability and serviceability for the new address."}, {"q": "Why did my pickup fail or get delayed?", "a": "Pickup can fail if the courier is unable to complete the pickup at your location. Common reasons include:<br><br>\u2022 Customer not available at the pickup address<br>\u2022 Phone number not reachable when the courier tried to contact you<br>\u2022 Incorrect or incomplete pickup address<br>\u2022 Pickup address outside the courier\u2019s serviceable area<br>\u2022 Entry restrictions at the pickup location<br>\u2022 Local issues such as weather, strikes, or route disruptions<br><br>In such cases, the courier usually attempts the pickup again.<br><br>If the courier does not attempt pickup within 3 business days, or if there are 3 failed pickup attempts, please contact our support team for assistance."}]}, {"name": "Ordering Related", "count": 7, "faqs": [{"q": "Where can I find my order details and track its status?", "a": "You can find all your order details in <a href=\"#\">My Orders</a> section. <br>\u2022 App: Tap Orders from the bottom menu <br>\u2022 Website: Go to Account &gt; <a href=\"#\">My Orders</a> <br><br>Each ordered item is listed separately. Tap on an item to view product details, delivery address, payment method, invoice, and current status. Order information updates automatically as your order progresses.<br><br>If your order status shows Processing, it means your order is awaiting confirmation. Orders are typically confirmed within a few hours, and you&#x27;ll receive updates via SMS and email.<br><br>Once confirmed, orders are usually dispatched within 1 business day. You can track the status in <a href=\"#\">My Orders</a> as it moves from Processing to Dispatched.<br><br>After your order is shipped, the tracking link will be available in Order Details and will also be sent to you via SMS and email. You can also track your shipment from the <a href=\"#\">My Orders</a> section by selecting your order and viewing the shipment timeline."}, {"q": "How can I modify my order (phone number/address/product)?", "a": "Order details cannot be edited directly after placing an order. If you need to request a change, please contact our support team as soon as possible with the correct details.<br><br>1. Changes to ordered items<br>Changes to products in an order are limited. Items can only be cancelled or removed, and this is possible until the order status is Awaiting Packing. Once the order moves beyond this stage, product changes would not be possible.<br><br>2. Contact number change<br>You can request a contact number change by contacting our support team at any stage of the order except when the order status is Out for Delivery (OFD).<br>The update usually takes 24\u201348 hours to be processed.<br><br>3. Delivery address change<br>You can raise a request for an address change through our support team. If the change is feasible, the address will be updated within 24\u201348 hours. Address updates are subject to courier feasibility and process limitations.<br><br>Important: Updating your contact number or address in My Profile section does not update an already placed order.<br><br>All modification requests are subject to operational feasibility and order status."}, {"q": "How do I know my order has been confirmed?", "a": "Your order is confirmed once you receive an order confirmation via email and SMS. You can also verify this in <a href=\"#\">My Orders</a> section: <br>\u2022 App: Tap Orders from the bottom menu <br>\u2022 Website: Go to Account &gt; <a href=\"#\">My Orders</a><br><br>If the status shows &quot;Order Placed&quot;, your order has been successfully confirmed. <br><br>If the order is not visible in <a href=\"#\">My Orders</a> section, contact our support team for assistance."}, {"q": "What should I do if my payment fails or my order is not visible after payment?", "a": "If you faced a problem during payment, check <a href=\"#\">My Orders</a> section. <br>\u2022 App: Tap Orders from the bottom menu <br>\u2022 Website: Go to Account &gt; <a href=\"#\">My Orders</a> Possible cases: <br>\u2022 Payment failed: Your order is created with a Payment Pending status. You can tap Retry Payment on the order card in <a href=\"#\">My Orders</a> to complete the purchase. Retry is available for up to 4 hours from order creation. <br>\u2022 Payment succeeded, but order not visible: Refresh the page and check again. It may take a few minutes for the order to appear. If money was deducted but your order was not placed, the amount is usually reversed automatically by your bank or payment provider. This often happens without any action needed from you. <br><br>If the issue persists, contact our support team with your payment reference ID."}, {"q": "I placed the same order twice by mistake. What should I do?", "a": "If you placed a duplicate order, open it in <a href=\"#\">My Orders</a> section. <br>\u2022 App: Tap Orders from the bottom menu <br>\u2022 Website: Go to Account &gt; <a href=\"#\">My Orders</a> <br><br>To cancel, select any item from the duplicate order and tap Cancel. Cancelling one item will automatically cancel the entire shipment. You can do this as long as the order is still in &quot;Awaiting Packing&quot; status. If it has already been packed, you may cancel at the time of delivery by refusing the order. <br><br>Refunds are usually processed within 1\u20132 business days after cancellation."}, {"q": "Why can&#x27;t I place a Pay on Delivery (POD) order?", "a": "Pay on Delivery (POD) availability depends on factors such as: <br>\u2022 Delivery pincode serviceability <br>\u2022 Order value or product eligibility <br>\u2022 Past delivery or order history<br><br>If POD is unavailable, please choose a prepaid payment option at checkout."}, {"q": "Do you ship internationally?", "a": "No. We currently ship only within India."}]}, {"name": "Product Authenticity", "count": 6, "faqs": [{"q": "How does Nutrabay ensure product authenticity, and how can I verify my product?", "a": "Nutrabay sells only 100% genuine products sourced directly from verified and trusted supply partners, including brands and authorized importers. All products are delivered in their original, sealed packaging.<br><br>You can verify your product&#x27;s authenticity by checking the manufacturing details, importer information, tax invoice, and sealed packaging. Many brands also provide batch numbers, QR codes, or scratch codes that can be verified on their official websites or apps.<br><br>For Nutrabay products, you can also verify authenticity using the unique scratch code sticker at https://nutrabay.com/authenticate.<br><br>If you need assistance verifying a third-party brand product, please contact our support team."}, {"q": "I&#x27;m concerned about the authenticity of a non-Nutrabay product, or its packaging looks different from what I saw online. What should I do?", "a": "Packaging may vary because brands regularly update their labels, designs, and security features. Receiving a product with different packaging does not necessarily indicate that it is not authentic.<br><br>For products from brands other than Nutrabay, the brand or importer details are printed on the product packaging. You can use these details to contact the brand or importer directly for authenticity verification.<br><br>As long as the product has the correct manufacturing/importer details and an intact seal, it is generally considered authentic. If you need further assistance or have any concerns, please contact our support team."}, {"q": "Do you source products directly from brands or authorized importers?", "a": "Yes. Our supply chain is strictly controlled.<br><br>We procure products directly from brands or their authorized importers and distributors in India.<br><br>We do not source from unverified wholesalers or open-market suppliers, ensuring all products are genuine and compliant."}, {"q": "What packaging or label details should I check when the order arrives?", "a": "Please check that the outer seal is intact and not tampered with.<br><br>Review the label for:<br>\u2022 Brand name<br>\u2022 Importer name<br>\u2022 MRP<br>\u2022 Batch number<br>\u2022 Manufacturing and expiry dates<br>\u2022 FSSAI details<br><br>If available, verify the scratch code, QR code, or hologram using the brand\u2019s official method."}, {"q": "Are product packaging changes common due to brand updates?", "a": "Yes, brands regularly update their packaging design, security features, fonts and colors. These changes do not affect product authenticity. As long as the product has proper manufacturer or importer details, sealed packaging and correct labels, it is considered genuine."}, {"q": "How do I verify the batch number and expiry information?", "a": "Batch number, manufacturing date, and expiry date are printed on the label or container.<br><br>You may cross-check these details on the brand\u2019s official website or with their customer support for additional confirmation.<br><br>Authentic products always have clear and readable codes and dates."}]}, {"name": "Payments & Coupons", "count": 7, "faqs": [{"q": "What payment methods does Nutrabay accept?", "a": "At checkout, you can choose from multiple secure payment options, depending on availability:<br><br>\u2022 UPI<br>\u2022 Debit and Credit Cards (Visa, Mastercard, RuPay, Amex, Diners, corporate, prepaid, retail, and international cards)<br>\u2022 Net Banking<br>\u2022 Mobile Wallets<br>\u2022 Pay on Delivery (POD), where available"}, {"q": "What is Pay on Delivery (POD) and how does it work?", "a": "Pay on Delivery (POD) allows you to pay when your order is delivered. If POD is available for your pincode and the items in your cart are eligible, you&#x27;ll see this option at checkout.<br><br>Select Pay on Delivery (POD) during checkout, confirm your delivery details, and place the order. At the time of delivery, you can pay using cash or other payment methods offered by the delivery partner. If you do not have exact cash, you can complete the payment online using the available payment options when the delivery agent arrives.<br><br>If POD is not shown at checkout, it means your pincode or the items in your cart are not eligible for Pay on Delivery."}, {"q": "What should I do if my payment failed, money was deducted or I was charged twice?", "a": "If your payment failed, your order may be created with a Payment Pending status. Go to the <a href=\"#\">My Orders</a> section, select the order, and choose Retry Payment. You can retry using the same or a different available payment method.<br><br>If money was deducted but no order was placed, or if you were charged twice for the same order, the extra amount is usually reversed automatically by your bank or payment provider. Please check your bank account or UPI app for the payment status.<br><br>If the reversal is delayed or does not happen, please contact your bank or payment provider for the expected refund timeline, as refunds for failed or duplicate payment transactions are processed by them."}, {"q": "How do I apply a coupon? Can I use more than one coupon?", "a": "You can apply your coupon code on the checkout page before completing payment.<br><br>Only one coupon can be used per order. If multiple offers are available, you can choose the one that gives you the best value. Some coupons may have a minimum order value or apply only to selected brands or product categories. The applicable terms and conditions are shown on the checkout page when you apply the coupon."}, {"q": "Does Nutrabay offer EMI or Buy Now Pay Later (BNPL)?", "a": "EMI and Buy Now Pay Later (BNPL) options are not available at the moment. You can complete payment using UPI, Credit Cards, Debit Cards, Wallets, Net Banking, or Pay on Delivery (POD), wherever applicable."}, {"q": "Are the prices inclusive of taxes and are there any additional or shipping charges?", "a": "Yes. All prices shown on Nutrabay are inclusive of applicable taxes, and there are no hidden charges. The product price displayed is the final price before shipping.<br><br>Shipping is free on orders above \u20b9350. For orders below \u20b9350, a delivery charge may apply. Any applicable shipping charges, discounts, and the final payable amount are clearly displayed in your cart and during checkout."}, {"q": "Does Nutrabay store my card details? Are card payments secure?", "a": "No. Nutrabay does not store any card details. All card payments are processed through RBI-compliant, secure payment gateways with encryption and fraud-monitoring systems. Card numbers and CVV information are never stored, and transactions are authorized only after verification by your bank or card provider."}]}, {"name": "Account & Profile", "count": 5, "faqs": [{"q": "How can I create a Nutrabay account?", "a": "You can create an account using your mobile number.<br><br>Enter your mobile number on the Sign Up screen and follow the instructions.<br><br>\u2022 If your number is not registered, you\u2019ll be asked to provide your email address<br>\u2022 If your number is already registered, you\u2019ll be redirected to log in<br>\u2022 If the email entered is already associated with an account, please use a different email address<br><br>You\u2019ll receive an OTP on your mobile number for verification.<br><br>Once the OTP is successfully verified, your account will be created.<br><br>You will receive a confirmation via SMS/email once registration is complete.<br><br>Your account will then be ready to use and you can start placing orders immediately."}, {"q": "How can I update my account details?", "a": "You can manage your account details from the My Account section.<br><br>\u2022 To update your name, date of birth, phone number, or email address, go to My Profile, make the required changes, and verify your updated phone number or email using the OTP sent to you (where applicable). Once verified, the changes are saved automatically.<br>\u2022 To add or manage addresses, go to My Addresses, select Add New Address, enter your name, phone number, complete address, and pincode, then save it. You can store multiple addresses and choose any saved address during checkout."}, {"q": "What if I forget my account password?", "a": "Use the Forgot Password option on the login page.<br><br>Enter your registered email or mobile number and complete OTP verification.<br><br>After verification, you can set a new password and log in again."}, {"q": "Are my personal details safe when I create an account?", "a": "Yes. Your personal information is protected using secure systems and encrypted connections.<br><br>Nutrabay does not store sensitive payment details and does not share your data with unauthorized third parties.<br><br>Your information is used only to manage your orders and improve your experience."}, {"q": "How can I permanently delete my Nutrabay account?", "a": "You can submit an account deletion request from the My Profile page. If you have any active orders, you will not be able to delete your account until those orders are completed.<br><br>Once confirmed, your account, saved addresses, and order history are permanently deleted.<br><br>This action cannot be reversed."}]}, {"name": "FitClub (Loyalty Program)", "count": 9, "faqs": [{"q": "What is FitClub? Do I need to pay to join?", "a": "FitClub is Nutrabay&#x27;s loyalty membership program. Every user who registers on the Nutrabay website or app automatically becomes a FitClub member. Membership is completely free. Members receive rewards, discounts, and benefits based on their FitClub membership level."}, {"q": "What are the FitClub membership levels, benefits, and how do I upgrade?", "a": "Your FitClub level determines the rewards and benefits you receive.<br><br>Membership levels are based on your total spend in the last 365 days:<br>\u2022 Explorer: Less than \u20b97,500<br>\u2022 Achiever: \u20b97,500 to less than \u20b920,000<br>\u2022 Legend: \u20b920,000 or more<br><br>You can upgrade your level by placing more orders and increasing your total spend. Your spend is updated 14 days after an order is successfully delivered, not immediately after purchase.<br><br>Once you cross a spending threshold, your level is upgraded immediately and a new 365-day membership cycle begins. To learn more about your membership benefits, click here."}, {"q": "How long is my FitClub membership valid?", "a": "Your FitClub membership is valid for a lifetime. However, your membership level is reviewed based on your purchase activity.<br><br>Once you reach a new level, you enjoy that level&#x27;s benefits for 365 days. If you qualify for a higher level during this period, your membership is upgraded immediately. After the 365-day period ends, your purchases during that period are reviewed and your level is reassessed based on your spending."}, {"q": "What are NB Coins and how do I earn them?", "a": "NB Coin is Nutrabay&#x27;s reward currency. 1 NB Coin = \u20b91 discount on eligible Nutrabay brand products.<br><br>FitClub members earn NB Coins on every eligible purchase:<br>\u2022 Explorer: 1 NB Coin for every \u20b9100 spent on each item<br>\u2022 Achiever: 2 NB Coins for every \u20b9100 spent on each item<br>\u2022 Legend: 3 NB Coins for every \u20b9100 spent on each item<br><br>NB Coins are credited after your order is delivered. They are not earned for cancelled items, and coins earned for returned items are deducted from your balance. Loyalty benefits currently apply only to orders placed through the Nutrabay website or app."}, {"q": "How can I use NB Coins? How much discount can I get?", "a": "NB Coins can be redeemed only on Nutrabay brand products. They can also be combined with other offers and discounts.<br><br>Redemption limits depend on your FitClub level:<br>\u2022 Explorer: Up to 5% of total item value (excluding other discounts)<br>\u2022 Achiever: Up to 10%<br>\u2022 Legend: Up to 15%"}, {"q": "When do NB Coins expire and how can I check my balance?", "a": "NB Coins earned through FitClub are valid for 6 months from the date they are credited. Every time a new eligible order is delivered, the expiry of all existing NB Coins is extended by another 6 months.<br><br>You can check your NB Coin balance by going to Profile \u2192 My Account \u2192 Wallet or clicking here."}, {"q": "What happens to my NB Coins if I cancel or return an order?", "a": "Cancelled items: NB Coins are not earned for cancelled items, and your total spend includes only successfully completed items.<br><br>If you redeemed NB Coins as a discount, those coins are refunded to your account for the cancelled item(s).<br><br>Returned items: NB Coins are initially credited after delivery. If an item is later returned, the earned NB Coins for that item are deducted from your balance. Redeemed NB Coins used as a discount are refunded for the returned item(s). For partial returns, only delivered items contribute to your total spend."}, {"q": "Why isn&#x27;t my FitClub level upgrading or my NB Coin balance updating?", "a": "FitClub Level: Your total spend is updated 14 days after your order is delivered. Once your spending crosses the required threshold, your membership level is upgraded immediately.<br><br>NB Coins: NB Coins are credited only after delivered items. If items are cancelled, no NB Coins are earned for those items. If fewer items are delivered than ordered, you&#x27;ll receive NB Coins only for the successfully delivered items."}, {"q": "Will I earn NB Coins on offline store purchases?", "a": "Currently, FitClub rewards and NB Coins are available only for purchases made through the Nutrabay website or app. Loyalty benefits for offline store purchases may be introduced in the future."}]}, {"name": "Product Reviews", "count": 7, "faqs": [{"q": "How can I submit a product review, and who can write one?", "a": "Any logged-in Nutrabay user can submit a review from the product page. Scroll to the Reviews section, select a star rating, write your feedback, and submit it.<br><br>Reviews may be written by any registered user. Customers who have purchased the product on Nutrabay will have a Verified Buyer badge displayed with their review, helping other customers identify purchase-based feedback."}, {"q": "Can I edit, delete, or add photos to my review?", "a": "Once a review has been submitted, it cannot be edited or deleted. This helps maintain transparency and reliability for all customers.<br><br>You can upload up to 5 photos with your review to support your feedback. Video uploads are not supported at this time."}, {"q": "Why is my review not visible yet?", "a": "After submission, reviews go through a standard moderation check before being published. This helps ensure reviews are genuine, relevant, and follow platform guidelines. Once approved, the review becomes visible on the product page."}, {"q": "Can I upload photos or videos with my review?", "a": "You can upload up to 5 photos with your review. Video uploads are not supported at this time."}, {"q": "Does Nutrabay moderate or filter reviews?", "a": "Yes. Reviews are moderated to ensure they remain relevant and helpful.<br><br>Reviews may be removed if they contain:<br>\u2022 Spam<br>\u2022 Offensive language<br>\u2022 Promotional content<br>\u2022 Information not related to the product<br>\u2022 Feedback focused only on delivery or service experience<br><br>Moderation does not depend on whether the review is positive or negative. The meaning of a genuine product review is never changed."}, {"q": "Will writing a negative review affect my order or refund?", "a": "No. Reviews have no impact on your order status, return eligibility, or refund processing. You are free to share honest feedback without it affecting any service-related outcomes."}, {"q": "Is my identity visible to brands when I post a review?", "a": "Only your username is shown with your review. Your personal details such as email address, phone number, or order information are not visible to brands."}]}];
let active=0;
const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search');
function drawNav(){
 nav.innerHTML='';
 DATA.forEach((c,i)=>{
 const d=document.createElement('div');
 d.className='cat'+(i===active?' active':'');
 d.innerHTML=`<span class="cat-title">${c.name}</span><span class="badge">${c.count}</span>`;
 d.onclick=()=>{active=i;drawNav();drawContent();};
 nav.appendChild(d);
 });
}
function drawContent(){
 const t=search.value.toLowerCase();
 const c=DATA[active];
 let h=`<h2>${c.name}</h2>`;
 c.faqs.filter(f=>!t||f.q.toLowerCase().includes(t)||f.a.toLowerCase().includes(t)).forEach(f=>{
 h+=`<div class="acc"><div class="head"><span>${f.q}</span><span class="icon">+</span></div><div class="body">${f.a}</div></div>`;
 });
 content.innerHTML=h;
 document.querySelectorAll('.head').forEach(head=>head.onclick=()=>{
 const p=head.parentElement;
 document.querySelectorAll('.acc.open').forEach(x=>{if(x!==p){x.classList.remove('open');x.querySelector('.icon').textContent='+';}});
 p.classList.toggle('open');
 head.querySelector('.icon').textContent=p.classList.contains('open')?'−':'+';
 });
}
search.oninput=drawContent;drawNav();drawContent();
</script></body></html>
